<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin panel</title>
        <link rel="stylesheet" href="stil.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div id="LISTA_JELA_DIV_ROD" style="display: none;">
            <div id="LISTA_JELA_DIV">
                <div id="dugmad_jela">
                    <input type="text" placeholder="Naziv jela" id="unos_imena_jela">
                    <button id="dostupno">D</button>
                    <button id="nedostupno">N</button>

                    <button id="zatvori" style="background-color: black;color: white;">X</button>
                </div>

                <br>

                *IDEJA* : PROMENA DOSTUPNOSTI JELA

                <div id="lista_jela">
                    
                </div>
            </div>
        </div>

        <div id="ADMIN_DIV">
            <h1 id="ime_sekcije">Admin panel</h1>
            <p id="opis_sekcije">
                <b>Klikom na dugme "Kraj smene", smena se završava i dnevni iznos se 
                    vraća na 0.00 RSD</b><br>
            </p>

            <h4 id="zarada">0.00 RSD</h4>

            <div id="dugmad">
                <button id="zaustavi"><img src="stani.png" alt="Loading...">Kraj smene</button>
                <button id="pokreni"><img src="kreni.png" alt="Loading...">Ponovo pokreni</button>
                <button id="izmeni"><img src="izmeni.png" alt="Loading...">Izmeni</button>
        
                <input type="number" placeholder="Šifra porudžbine" min="0" id="sifra">
                <button id="gotova_porudzbina_dugme">Gotovo</button>
                <button id="obrisi_po_broju">Obriši</button>
            </div>

            <br><br>
        </div>

        <br>

        <h1 id="ime_sekcije">Porudžbine</h1>

        <br>

        <div id="PORUDZBINE">
            
        </div>

        <script>                 
            let admin_lista=document.getElementById("PORUDZBINE");
            let dnevna_zarada_stanje=document.getElementById("zarada");
            let zarada=document.getElementById("zarada");
            let s=Number(0);

            let unos_sifre_proizvoda=document.getElementById("sifra");
            let gotova_porudzbina_dugme=document.getElementById("gotova_porudzbina_dugme");

            //Ažuriranje porudžbina na svakih 5 sekundi
            //oni sa stanjem true, ce biti na opcaity: 40%

            setInterval(()=>{
                try{
                    fetch("/lista")
                    .then(odg=>odg.json())
                    .then(podatak=>{
                        //JSON.stringify(podatak);
                        console.log(podatak); 

                        let n=podatak.length;
                        if(n==0){
                            let prazna_lista_p=document.createElement("p");
                            prazna_lista_p.textContent="Još nema porudžbina!";
                            admin_lista.append(prazna_lista_p);
                        }

                        for(let j=0; j<n; j++){
                            let p=document.createElement("p");
                            p.style="max-width: 70vw; font-size: 1.2rem;"
                            
                            admin_lista.append(p);

                            let korpa=podatak[j].korpa;
                            //console.log(korpa);

                            p.textContent=`
                                Ime: ${podatak[j].ime}, Adresa: ${podatak[j].adresa}, Kontakt: ${podatak[j].kontakt}, poruka: ${podatak[j].poruka}, UKUPNO: ${podatak[j].racun}
                            `;

                            let korpa_admin=document.createElement("div");
                            korpa_admin.className="korpa_admin";

                            for(let x=0; x<korpa.length; x++){
                                let p2=document.createElement("p");
                                p2.textContent=`${korpa[x].kolicina}x
                                ${korpa[x].naziv} - ${korpa[x].cena}`;

                                korpa_admin.append(p2);
                            }

                            admin_lista.append(korpa_admin);
                            
                            //provera stanja:
                            if(podatak[j].gotovo_stanje == true){
                                p.style="opacity: 30%";
                                korpa_admin.style.color="green";
                            }

                            s=s+Number(podatak[j].racun);
                            zarada.textContent=`${s} RSD`;
                        }
                    })
                }

                catch(error){
                    throw error;
                }

                admin_lista.innerHTML=` `;
                s=0.0;
                zarada.textContent=`${s} RSD`;
            }, 5000);

            //Gotova porudžbina:
            gotova_porudzbina_dugme.addEventListener("click", async ()=> {
                try{
                    await fetch("/gotovaPorudzbina" , {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body:JSON.stringify({
                                "sifra": unos_sifre_proizvoda.value
                            })
                        }
                    )
                }

                catch(error){
                    throw error;
                }
            })

            //Brisanje porudzbina(e) po broju:

            let obrisi_po_broju=document.getElementById("obrisi_po_broju");

            obrisi_po_broju.addEventListener("click" , async ()=>{
                try{
                    await fetch("/obrisi" , {
                        method: "POST",
                        headers:{
                            "Content-Type": "application/json"
                        },
                        body:JSON.stringify({
                            "kontakt_za_brisanje": unos_sifre_proizvoda.value
                        })
                    })
                }
                
                catch(error){
                    throw error;
                }
            })

            //Smena:
            let dugme_kraj, dugme_pokreni;

            dugme_kraj=document.getElementById("zaustavi");
            dugme_pokreni=document.getElementById("pokreni");

            dugme_kraj.addEventListener("click" , async ()=>{
                dugme_kraj.style.display="none";
                dugme_pokreni.style.display="flex";    

                let odg=await fetch("/kraj_smene" , {
                    method: "POST"
                })

                let poruka=await odg.json();

                if(poruka==1) window.alert("Smena uspešno završena!");
            })

            dugme_pokreni.addEventListener("click" , async ()=>{
                dugme_pokreni.style.display="none";
                dugme_kraj.style.display="flex";

                let odg=await fetch("/pocetak_smene" , {
                    method: "POST"
                })

                let poruka=await odg.json();

                if(poruka==1) window.alert("Smena uspešno započeta!");
            })

            //Dostupnost jela:
            let izmeni=document.getElementById("izmeni");
            let izmena_jela_rod=document.getElementById("LISTA_JELA_DIV_ROD");
            let izmena_jela_div=document.getElementById("LISTA_JELA_DIV");
            let lista_jela=document.getElementById("lista_jela");
            let zatvori=document.getElementById("zatvori");

            izmeni.addEventListener("click" , async ()=>{
                izmena_jela_rod.style.display="flex";
            })

            zatvori.addEventListener("click" , ()=>{
                izmena_jela_rod.style.display="none";
            })

            setInterval(async ()=>{
                await fetch("/admin_lista_jela")
                .then(odg=>odg.json())
                .then(podatak=>{
                    let n=podatak.length;

                    for(let i=0; i<n; i++){
                        //boja paragrafa:
                        let p=document.createElement("p");

                        if(podatak[i].dostupno==true) p.style.color="green";
                            else p.style.color="red";

                        p.textContent=`${podatak[i].ime} => ${podatak[i].dostupno}`;

                        lista_jela.append(p);
                    }
                })

                //lista_jela.innerHTML=` `;
            }, 5000) //1 sec.
        </script>
    </body>
</html>
